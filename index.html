<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kéo Búa Bao Online</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #070b16;
    --card: #10182b;
    --card2: #151f36;
    --border: #263552;
    --blue: #4f8cff;
    --purple: #8b5cf6;
    --red: #ff496c;
    --green: #32d583;
    --yellow: #ffc857;
    --text: #f7f9ff;
    --muted: #8995ad;
}

body {
    min-height: 100vh;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(circle at 20% 10%, #182b5c 0, transparent 30%),
        radial-gradient(circle at 80% 90%, #32184f 0, transparent 30%),
        var(--bg);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 18px;
}

.app {
    width: 100%;
    max-width: 620px;
}

/* =========================
   LOGO
========================= */

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo-icon {
    font-size: 42px;
    margin-bottom: 4px;
}

.logo h1 {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
}

/* =========================
   CARD
========================= */

.card {
    background: rgba(16, 24, 43, .94);

    border: 1px solid var(--border);

    border-radius: 24px;

    padding: 22px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.03);

    backdrop-filter: blur(15px);
}

/* =========================
   LOBBY
========================= */

.lobby-title {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 18px;
}

.input-group {
    margin-bottom: 13px;
}

.input-group label {
    display: block;

    color: #aab4c8;

    font-size: 12px;

    margin-bottom: 7px;

    font-weight: 700;
}

input {
    width: 100%;

    padding: 14px 15px;

    border-radius: 13px;

    border: 1px solid #2a3959;

    background: #0b1222;

    color: white;

    font-size: 16px;

    outline: none;

    transition: .2s;
}

input:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 3px rgba(79,140,255,.12);
}

.join-btn {
    width: 100%;

    border: 0;

    padding: 15px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #4f8cff,
            #7357ff
        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    margin-top: 5px;

    box-shadow:
        0 10px 25px rgba(79,140,255,.2);

    transition: .2s;
}

.join-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

.hint {
    text-align: center;

    color: #68758d;

    font-size: 12px;

    margin-top: 13px;
}

/* =========================
   GAME TOP
========================= */

.game-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;
}

.room-badge {
    background: #0b1222;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 7px 10px;

    font-size: 12px;

    color: #aeb9ce;
}

.status {
    display: flex;

    align-items: center;

    gap: 6px;

    color: #aeb9ce;

    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--yellow);

    box-shadow: 0 0 10px currentColor;
}

/* =========================
   PLAYERS
========================= */

.players {
    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 12px;

    margin-bottom: 20px;
}

.player {
    background:
        linear-gradient(
            145deg,
            #151f36,
            #0d1527
        );

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 15px 8px;

    text-align: center;

    min-width: 0;
}

.player.me {
    border-color: rgba(79,140,255,.35);
}

.player.enemy {
    border-color: rgba(255,73,108,.25);
}

.avatar {
    width: 55px;
    height: 55px;

    margin: 0 auto 8px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 26px;

    background: #0b1222;

    border: 1px solid #334361;
}

.player-name {
    font-size: 14px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-role {
    color: var(--muted);

    font-size: 10px;

    margin-top: 3px;
}

.score {
    font-size: 27px;

    font-weight: 900;

    margin-top: 5px;
}

.vs {
    font-size: 14px;

    font-weight: 900;

    color: #68758d;

    background: #0b1222;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
}

/* =========================
   BATTLE
========================= */

.battle {
    background: #0b1222;

    border: 1px solid var(--border);

    border-radius: 18px;

    min-height: 170px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 35px;

    margin-bottom: 18px;
}

.hand-box {
    text-align: center;
}

.hand {
    width: 85px;
    height: 85px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #18243d,
            #0d1526
        );

    border: 1px solid #2c3b5c;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 46px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25);

    transition: .3s;
}

.hand-label {
    color: #748198;

    font-size: 10px;

    margin-top: 7px;

    text-transform: uppercase;
}

.battle-vs {
    color: #52617b;

    font-size: 13px;

    font-weight: 900;
}

/* =========================
   RESULT
========================= */

.result {
    min-height: 30px;

    text-align: center;

    font-size: 18px;

    font-weight: 900;

    margin: 13px 0;
}

.win {
    color: var(--green);
}

.lose {
    color: var(--red);
}

.draw {
    color: var(--yellow);
}

/* =========================
   CHOICES
========================= */

.choice-title {
    text-align: center;

    color: #8895ab;

    font-size: 12px;

    margin-bottom: 10px;
}

.choices {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.choice {
    border: 1px solid #293958;

    background:
        linear-gradient(
            145deg,
            #16233d,
            #0e172a
        );

    border-radius: 16px;

    padding: 15px 8px;

    color: white;

    cursor: pointer;

    transition: .18s;

    min-height: 105px;
}

.choice:hover:not(:disabled) {
    transform: translateY(-3px);

    border-color: var(--blue);

    background: #182b4c;
}

.choice.selected {
    background:
        linear-gradient(
            145deg,
            #315eb6,
            #5c42bc
        );

    border-color: #78a5ff;

    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(79,140,255,.2);
}

.choice:disabled {
    opacity: .45;

    cursor: not-allowed;
}

.choice-icon {
    display: block;

    font-size: 40px;

    margin-bottom: 5px;
}

.choice-name {
    font-size: 11px;

    color: #aeb9ce;

    font-weight: 700;
}

/* =========================
   RESET
========================= */

.reset-btn {
    width: 100%;

    border: 0;

    background:
        linear-gradient(
            135deg,
            #e94560,
            #b92e62
        );

    color: white;

    border-radius: 13px;

    padding: 13px;

    font-weight: 800;

    font-size: 15px;

    cursor: pointer;

    margin-top: 12px;
}

.hidden {
    display: none !important;
}

/* =========================
   WAITING
========================= */

.waiting {
    text-align: center;

    padding: 22px 5px;
}

.loading {
    width: 38px;
    height: 38px;

    border: 3px solid #273653;

    border-top-color: var(--blue);

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width: 480px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 15px;

        border-radius: 20px;
    }

    .players {
        gap: 7px;
    }

    .battle {
        gap: 15px;
    }

    .hand {
        width: 72px;
        height: 72px;

        font-size: 38px;
    }

    .choice {
        min-height: 95px;
    }

    .choice-icon {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">
        <div class="logo-icon">✊</div>

        <h1>KÉO BÚA BAO</h1>

        <p>ONLINE • 2 NGƯỜI</p>
    </div>


    <!-- =========================
         LOBBY
    ========================== -->

    <div id="lobby" class="card">

        <div class="lobby-title">
            🎮 Vào trận
        </div>

        <div class="input-group">

            <label>TÊN NGƯỜI CHƠI</label>

            <input
                id="nameInput"
                maxlength="20"
                placeholder="Nhập tên của bạn..."
                autocomplete="off"
            >

        </div>


        <div class="input-group">

            <label>MÃ PHÒNG</label>

            <input
                id="roomInput"
                maxlength="20"
                placeholder="Ví dụ: ABC123"
                autocomplete="off"
            >

        </div>


        <button
            id="joinBtn"
            class="join-btn"
        >
            VÀO PHÒNG
        </button>


        <div class="hint">
            Hai người phải nhập cùng một mã phòng.
        </div>

    </div>


    <!-- =========================
         GAME
    ========================== -->

    <div
        id="game"
        class="card hidden"
    >

        <div class="game-header">

            <div
                id="roomBadge"
                class="room-badge"
            >
                PHÒNG
            </div>

            <div class="status">

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="status">
                    Đang kết nối...
                </span>

            </div>

        </div>


        <!-- PLAYERS -->

        <div class="players">

            <div class="player me">

                <div class="avatar">
                    😎
                </div>

                <div
                    id="myName"
                    class="player-name"
                >
                    Bạn
                </div>

                <div class="player-role">
                    BẠN
                </div>

                <div
                    id="myScore"
                    class="score"
                >
                    0
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="player enemy">

                <div class="avatar">
                    👤
                </div>

                <div
                    id="peerName"
                    class="player-name"
                >
                    Đang chờ...
                </div>

                <div class="player-role">
                    ĐỐI THỦ
                </div>

                <div
                    id="peerScore"
                    class="score"
                >
                    0
                </div>

            </div>

        </div>


        <!-- BATTLE -->

        <div class="battle">

            <div class="hand-box">

                <div
                    id="myHand"
                    class="hand"
                >
                    ❔
                </div>

                <div class="hand-label">
                    Bạn
                </div>

            </div>


            <div class="battle-vs">
                VS
            </div>


            <div class="hand-box">

                <div
                    id="peerHand"
                    class="hand"
                >
                    ❔
                </div>

                <div class="hand-label">
                    Đối thủ
                </div>

            </div>

        </div>


        <div
            id="result"
            class="result"
        ></div>


        <div
            id="waiting"
            class="waiting hidden"
        >

            <div class="loading"></div>

            <div>
                Đang chờ đối thủ...
            </div>

        </div>


        <!-- CHOICE -->

        <div id="gameControls">

            <div class="choice-title">
                CHỌN NƯỚC ĐI CỦA BẠN
            </div>


            <div class="choices">

                <button
                    class="choice"
                    data-choice="1"
                >

                    <span class="choice-icon">
                        ✊
                    </span>

                    <span class="choice-name">
                        BÚA
                    </span>

                </button>


                <button
                    class="choice"
                    data-choice="2"
                >

                    <span class="choice-icon">
                        ✋
                    </span>

                    <span class="choice-name">
                        BAO
                    </span>

                </button>


                <button
                    class="choice"
                    data-choice="3"
                >

                    <span class="choice-icon">
                        ✌️
                    </span>

                    <span class="choice-name">
                        KÉO
                    </span>

                </button>

            </div>


            <button
                id="resetBtn"
                class="reset-btn hidden"
            >
                🔄 VÒNG TIẾP THEO
            </button>

        </div>

    </div>

</div>


<script>
/* =====================================================
   CẤU HÌNH
===================================================== */

const MQTT_BROKER =
    "wss://broker.emqx.io:8084/mqtt";

const ICE_SERVERS = [
    {
        urls: "stun:stun.l.google.com:19302"
    },
    {
        urls: "stun:stun1.l.google.com:19302"
    }
];


/* =====================================================
   STATE
===================================================== */

let mqttClient = null;

let pc = null;

let dataChannel = null;

let roomId = "";

let myId = "";

let myName = "";

let peerId = null;

let peerName = null;

let myChoice = null;

let peerChoice = null;

let myScore = 0;

let peerScore = 0;

let roomLocked = false;

let peerJoined = false;

let pendingIce = [];


/* =====================================================
   DOM
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   JOIN
===================================================== */

$("joinBtn").onclick =
    joinRoom;


$("roomInput").addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {
            joinRoom();
        }

    }
);


$("nameInput").addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {
            $("roomInput").focus();
        }

    }
);


function joinRoom() {

    myName =
        $("nameInput")
            .value
            .trim();

    roomId =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();


    if (!myName) {

        alert(
            "Vui lòng nhập tên người chơi."
        );

        $("nameInput").focus();

        return;
    }


    if (!roomId) {

        alert(
            "Vui lòng nhập mã phòng."
        );

        $("roomInput").focus();

        return;
    }


    if (window.crypto &&
        crypto.randomUUID) {

        myId =
            crypto.randomUUID();

    } else {

        myId =
            Math.random()
                .toString(36)
                .slice(2) +
            Date.now();

    }


    $("myName").textContent =
        myName;


    $("roomBadge").textContent =
        "PHÒNG " + roomId;


    $("lobby")
        .classList
        .add("hidden");


    $("game")
        .classList
        .remove("hidden");


    setStatus(
        "Đang kết nối máy chủ...",
        "waiting"
    );


    connectMQTT();
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type = "waiting"
) {

    $("status").textContent =
        text;


    const dot =
        $("statusDot");


    if (type === "connected") {

        dot.style.color =
            "#32d583";

        dot.style.background =
            "#32d583";

    } else if (
        type === "error"
    ) {

        dot.style.color =
            "#ff496c";

        dot.style.background =
            "#ff496c";

    } else {

        dot.style.color =
            "#ffc857";

        dot.style.background =
            "#ffc857";
    }
}


/* =====================================================
   MQTT
===================================================== */

function connectMQTT() {

    mqttClient =
        mqtt.connect(
            MQTT_BROKER,
            {

                clientId:
                    "rps_" +
                    myId
                        .replace(
                            /[^a-zA-Z0-9]/g,
                            ""
                        )
                        .slice(0, 15) +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2, 7),

                clean: true,

                reconnectPeriod: 2000,

                connectTimeout: 10000

            }
        );


    mqttClient.on(
        "connect",
        () => {

            const topic =
                "rps/" + roomId;


            mqttClient.subscribe(
                topic,
                err => {

                    if (err) {

                        setStatus(
                            "Không thể vào phòng",
                            "error"
                        );

                        return;
                    }


                    setStatus(
                        "Đang tìm đối thủ...",
                        "waiting"
                    );


                    sendMQTT({

                        type: "hello",

                        from: myId,

                        name: myName

                    });

                }
            );

        }
    );


    mqttClient.on(
        "reconnect",
        () => {

            setStatus(
                "Đang kết nối lại...",
                "waiting"
            );

        }
    );


    mqttClient.on(
        "error",
        error => {

            console.error(
                "MQTT:",
                error
            );

            setStatus(
                "Lỗi máy chủ",
                "error"
            );

        }
    );


    mqttClient.on(
        "message",
        async (
            topic,
            payload
        ) => {

            try {

                const msg =
                    JSON.parse(
                        payload.toString()
                    );


                if (
                    msg.from === myId
                ) {
                    return;
                }


                await handleMessage(msg);

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );
}


/* =====================================================
   SEND
===================================================== */

function sendMQTT(data) {

    if (
        !mqttClient ||
        !mqttClient.connected
    ) {
        return;
    }


    mqttClient.publish(

        "rps/" + roomId,

        JSON.stringify(data)

    );
}


/* =====================================================
   SIGNAL MESSAGE
===================================================== */

async function handleMessage(msg) {

    /* ==========================
       HELLO
    ========================== */

    if (msg.type === "hello") {

        /*
         * Nếu đã có đối thủ
         * thì từ chối người thứ 3.
         */

        if (
            peerId &&
            msg.from !== peerId
        ) {

            sendMQTT({

                type: "room_full",

                from: myId,

                to: msg.from

            });

            return;
        }


        /*
         * Người đầu tiên nhận người thứ hai.
         */

        if (!peerId) {

            peerId =
                msg.from;

            peerName =
                msg.name ||
                "Đối thủ";

            peerJoined =
                true;


            $("peerName")
                .textContent =
                peerName;


            setStatus(
                "Đã tìm thấy đối thủ",
                "waiting"
            );


            /*
             * ID nhỏ hơn tạo OFFER.
             */

            if (
                myId < peerId
            ) {

                await createOffer();

            } else {

                /*
                 * Người còn lại
                 * chờ OFFER.
                 */

                setStatus(
                    "Đã tìm thấy " +
                    peerName +
                    ", đang kết nối...",
                    "waiting"
                );

            }

        }

        return;
    }


    /* ==========================
       ROOM FULL
    ========================== */

    if (
        msg.type === "room_full" &&
        msg.to === myId
    ) {

        setStatus(
            "Phòng đã đủ 2 người",
            "error"
        );


        $("gameControls")
            .classList
            .add("hidden");


        $("waiting")
            .classList
            .remove("hidden");


        $("waiting").innerHTML =
            `
            <div style="
                font-size:42px;
                margin-bottom:10px;
            ">🚫</div>

            <b>Phòng đã đủ 2 người</b>

            <div style="
                color:#7d8aa2;
                font-size:12px;
                margin-top:6px;
            ">
                Hãy dùng mã phòng khác.
            </div>
            `;

        return;
    }


    /* ==========================
       OFFER
    ========================== */

    if (
        msg.type === "offer" &&
        msg.to === myId
    ) {

        peerId =
            msg.from;

        peerName =
            msg.name ||
            peerName ||
            "Đối thủ";


        $("peerName")
            .textContent =
            peerName;


        await handleOffer(
            msg.sdp
        );

        return;
    }


    /* ==========================
       ANSWER
    ========================== */

    if (
        msg.type === "answer" &&
        msg.to === myId
    ) {

        if (!pc) {
            return;
        }


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                msg.sdp
            )
        );


        await flushIce();

        return;
    }


    /* ==========================
       ICE
    ========================== */

    if (
        msg.type === "ice" &&
        msg.to === myId
    ) {

        await handleIce(
            msg.candidate
        );

        return;
    }

}


/* =====================================================
   WEBRTC
===================================================== */

function createPeerConnection() {

    if (pc) {

        try {
            pc.close();
        } catch (e) {}

    }


    pendingIce = [];


    pc =
        new RTCPeerConnection({
            iceServers:
                ICE_SERVERS
        });


    pc.onicecandidate =
        event => {

            if (
                event.candidate &&
                peerId
            ) {

                sendMQTT({

                    type: "ice",

                    from: myId,

                    to: peerId,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                setStatus(
                    "Đã kết nối — chiến thôi!",
                    "connected"
                );


                $("waiting")
                    .classList
                    .add("hidden");


                $("gameControls")
                    .classList
                    .remove("hidden");

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                setStatus(
                    "Kết nối thất bại",
                    "error"
                );

            }

        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                pc.iceConnectionState
            );

        };
}


/* =====================================================
   DATA CHANNEL
===================================================== */

function setupDataChannel(
    channel
) {

    dataChannel =
        channel;


    dataChannel.onopen =
        () => {

            setStatus(
                "Đã kết nối — chọn nước đi!",
                "connected"
            );


            $("waiting")
                .classList
                .add("hidden");


            $("gameControls")
                .classList
                .remove("hidden");


            /*
             * Gửi tên lần nữa qua
             * kênh WebRTC.
             */

            sendGame({
                type: "player_name",
                name: myName
            });

        };


    dataChannel.onclose =
        () => {

            setStatus(
                "Đối thủ đã rời phòng",
                "error"
            );

        };


    dataChannel.onmessage =
        event => {

            try {

                const msg =
                    JSON.parse(
                        event.data
                    );


                if (
                    msg.type ===
                    "player_name"
                ) {

                    peerName =
                        msg.name ||
                        "Đối thủ";


                    $("peerName")
                        .textContent =
                        peerName;

                }


                if (
                    msg.type === "choice"
                ) {

                    peerChoice =
                        msg.value;


                    showPeerHand(
                        peerChoice
                    );


                    checkResult();

                }


                if (
                    msg.type ===
                    "reset"
                ) {

                    resetRound(false);

                }

            } catch (e) {

                console.error(e);

            }

        };
}


/* =====================================================
   CREATE OFFER
===================================================== */

async function createOffer() {

    createPeerConnection();


    setupDataChannel(
        pc.createDataChannel(
            "game"
        )
    );


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    sendMQTT({

        type: "offer",

        from: myId,

        to: peerId,

        name: myName,

        sdp: offer

    });

}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    sdp
) {

    createPeerConnection();


    pc.ondatachannel =
        event => {

            setupDataChannel(
                event.channel
            );

        };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            sdp
        )
    );


    await flushIce();


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    sendMQTT({

        type: "answer",

        from: myId,

        to: peerId,

        name: myName,

        sdp: answer

    });

}


/* =====================================================
   ICE
===================================================== */

async function handleIce(
    candidate
) {

    if (!pc) {

        pendingIce.push(
            candidate
        );

        return;
    }


    if (
        !pc.remoteDescription
    ) {

        pendingIce.push(
            candidate
        );

        return;
    }


    try {

        await pc.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (e) {

        console.warn(
            "ICE error:",
            e
        );

    }

}


async function flushIce() {

    if (!pc) {
        return;
    }


    for (
        const candidate
        of pendingIce
    ) {

        try {

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (e) {}

    }


    pendingIce = [];
}


/* =====================================================
   GAME
===================================================== */

document
    .querySelectorAll(".choice")
    .forEach(button => {

        button.onclick = () => {

            if (
                !dataChannel ||
                dataChannel.readyState !==
                "open"
            ) {
                return;
            }


            if (
                myChoice !== null
            ) {
                return;
            }


            myChoice =
                Number(
                    button.dataset.choice
                );


            document
                .querySelectorAll(
                    ".choice"
                )
                .forEach(
                    b => {
                        b.classList
                            .remove(
                                "selected"
                            );
                    }
                );


            button.classList
                .add("selected");


            showMyHand(
                myChoice
            );


            sendGame({

                type: "choice",

                value: myChoice

            });


            $("result")
                .textContent =
                "Đã chọn — chờ đối thủ...";

        };

    });


function sendGame(data) {

    if (
        dataChannel &&
        dataChannel.readyState ===
        "open"
    ) {

        dataChannel.send(
            JSON.stringify(data)
        );

    }

}


/* =====================================================
   HAND
===================================================== */

const HANDS = {
    1: "✊",
    2: "✋",
    3: "✌️"
};


function showMyHand(
    choice
) {

    $("myHand")
        .textContent =
        HANDS[choice];

}


function showPeerHand(
    choice
) {

    $("peerHand")
        .textContent =
        HANDS[choice];

}


/* =====================================================
   RESULT
===================================================== */

function checkResult() {

    if (
        myChoice === null ||
        peerChoice === null
    ) {
        return;
    }


    let text = "";

    let cls = "";


    if (
        myChoice === peerChoice
    ) {

        text =
            "🤝 HÒA!";

        cls =
            "draw";

    } else {

        /*
         * Búa thắng Kéo
         * Bao thắng Búa
         * Kéo thắng Bao
         */

        const wins = {

            1: 3,

            2: 1,

            3: 2

        };


        if (
            wins[myChoice] ===
            peerChoice
        ) {

            text =
                "🏆 BẠN THẮNG!";

            cls =
                "win";


            myScore++;

        } else {

            text =
                "💀 BẠN THUA!";

            cls =
                "lose";


            peerScore++;

        }

    }


    $("myScore")
        .textContent =
        myScore;


    $("peerScore")
        .textContent =
        peerScore;


    $("result")
        .textContent =
        text;


    $("result")
        .className =
        "result " + cls;


    $("resetBtn")
        .classList
        .remove("hidden");


    /*
     * Không cho chọn thêm
     */

    document
        .querySelectorAll(
            ".choice"
        )
        .forEach(
            b => {
                b.disabled = true;
            }
        );

}


/* =====================================================
   RESET
===================================================== */

$("resetBtn").onclick =
    () => {

        resetRound(true);

    };


function resetRound(
    send
) {

    myChoice = null;

    peerChoice = null;


    $("myHand")
        .textContent =
        "❔";


    $("peerHand")
        .textContent =
        "❔";


    $("result")
        .textContent =
        "";


    $("result")
        .className =
        "result";


    $("resetBtn")
        .classList
        .add("hidden");


    document
        .querySelectorAll(
            ".choice"
        )
        .forEach(
            b => {

                b.disabled =
                    false;

                b.classList
                    .remove(
                        "selected"
                    );

            }
        );


    if (send) {

        sendGame({
            type: "reset"
        });

    }

}
</script>
